<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pasien | SMART PHARMACIST</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>SMART PHARMACIST</h1>
      <small>Sistem Manajemen Antar Obat Terintegrasi Tele-Pharmacist</small>
      <div class="auth" id="authBox"></div>
    </header>

    <main>
      <div class="menu" id="menu">
        <button class="menu-box" id="layananBox" onclick="buka('layanan')" hidden>
          <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z" />
              <path d="m8.5 8.5 7 7" />
            </svg>
          </span>
          <b>Layanan Obat</b>
          <small>Ajukan resep / obat baru</small>
        </button>

        <button class="menu-box" onclick="buka('lacak')">
          <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          </span>
          <b>Lacak Obat</b>
          <small>Cek status &amp; konsultasi</small>
        </button>
      </div>

      <section id="layanan" hidden>
        <button class="back" onclick="kembali()">&larr; Kembali</button>
        <div class="card">
          <h2>Ajukan Layanan Obat</h2>
          <label>Nama</label>
          <input id="nama" />
          <label>No. HP</label>
          <input id="hp" type="tel" />
          <label>Obat / resep</label>
          <textarea id="obat" rows="3" placeholder="Contoh: Amlodipin 5 mg x 30, Metformin 500 mg x 60"></textarea>
          <label>Metode</label>
          <select id="metode">
            <option value="antar">Diantar ke rumah</option>
            <option value="ambil">Ambil sendiri</option>
          </select>
          <label>Alamat pengantaran</label>
          <textarea id="alamat" rows="2"></textarea>
          <button class="p" onclick="ajukan()">Kirim</button>
          <p id="info" class="m"></p>
        </div>
      </section>

      <section id="lacak" hidden>
        <button class="back" onclick="kembali()">&larr; Kembali</button>
        <div class="card">
          <h2>Lacak Obat &amp; Konsultasi Apoteker</h2>
          <div class="row">
            <input id="kode" placeholder="Kode, mis. SP-0001" />
            <button class="p" onclick="lacak()">Lacak</button>
          </div>
          <p id="sukses" class="m"></p>
          <div id="hasil"></div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
    <script>
      const state = { kodeAktif: "" };
      const HP_KEY = "sp_user_pasien";
      let authMode = "login";

      const noHp = () => localStorage.getItem(HP_KEY) || "";

      function renderAuthPasien() {
        const box = $("#authBox");

        if (getToken("pasien")) {
          box.innerHTML = `
            <span class="auth-info">Login sebagai <b>${esc(noHp())}</b></span>
            <button class="p" onclick="logoutPasien()">Logout</button>
          `;
          $("#layananBox").hidden = false;
          $("#hp").value = noHp();
          return;
        }

        $("#layananBox").hidden = true;
        const daftar = authMode === "daftar";
        box.innerHTML = `
          <input id="pasien-hp" type="tel" inputmode="numeric" placeholder="No. HP" />
          <input id="pasien-pass" type="password" placeholder="Password" />
          ${daftar ? '<input id="pasien-konfirmasi" type="password" placeholder="Ulangi password" />' : ""}
          <button class="p" onclick="authPasien()">${daftar ? "Daftar" : "Masuk"}</button>
          <button class="p secondary" onclick="gantiMode()">${daftar ? "Sudah punya akun" : "Daftar"}</button>
          <span id="pasien-msg" class="auth-msg"></span>
        `;
      }

      function gantiMode() {
        authMode = authMode === "login" ? "daftar" : "login";
        renderAuthPasien();
      }

      async function authPasien() {
        const hp = $("#pasien-hp").value.trim();
        const sandi = $("#pasien-pass").value;
        const konfirmasi = $("#pasien-konfirmasi")?.value;
        const msg = $("#pasien-msg");

        try {
          if (authMode === "daftar") {
            if (sandi !== konfirmasi) throw new Error("Password tidak sama");
            await api("/api/pasien/daftar", "POST", { no_hp: hp, password: sandi }, false);
            authMode = "login";
            localStorage.setItem(HP_KEY, hp);
            writeToken("pasien", "");
            renderAuthPasien();
            msg.textContent = "Pendaftaran berhasil, silakan masuk.";
            return;
          }

          const d = await api("/api/pasien/login", "POST", { no_hp: hp, password: sandi }, false);
          writeToken("pasien", d.token);
          localStorage.setItem(HP_KEY, d.no_hp);
          renderAuthPasien();
        } catch (e) {
          msg.textContent = e.message;
        }
      }

      async function logoutPasien() {
        try {
          await api("/api/auth/logout", "POST", {});
        } catch (e) {
          /* token sudah tidak berlaku, abaikan */
        }
        writeToken("pasien", "");
        localStorage.removeItem(HP_KEY);
        authMode = "login";
        kembali();
        renderAuthPasien();
      }

      function buka(target) {
        $("#menu").hidden = true;
        $("#layanan").hidden = target !== "layanan";
        $("#lacak").hidden = target !== "lacak";
      }

      function kembali() {
        $("#layanan").hidden = true;
        $("#lacak").hidden = true;
        $("#menu").hidden = false;
      }

      async function ajukan() {
        try {
          const d = await api("/api/resep", "POST", {
            nama: $("#nama").value,
            no_hp: $("#hp").value,
            obat: $("#obat").value,
            metode: $("#metode").value,
            alamat: $("#alamat").value,
          });
          $("#kode").value = d.kode;
          $("#sukses").textContent = "Pengajuan berhasil! Simpan kode Anda: " + d.kode;
          buka("lacak");
          lacak();
        } catch (e) {
          $("#info").textContent = e.message;
        }
      }

      async function lacak() {
        state.kodeAktif = $("#kode").value.trim();
        if (!state.kodeAktif) return;

        try {
          const d = await api("/api/track/" + encodeURIComponent(state.kodeAktif));
          const i = d.alur.indexOf(d.status);
          $("#hasil").innerHTML = `
            <p><b>${esc(d.kode)}</b> · ${esc(d.nama)}<br><span class="m">${esc(d.obat)}</span></p>
            <div class="steps">${d.alur.map((s, k) => `<span class="st ${k <= i ? "done" : ""}">${s}</span>`).join("")}</div>
            ${d.otp ? `<p>Kode serah terima (berikan ke kurir): <span class="otp">${d.otp}</span></p>` : ""}
            <div class="chat">${chatHtml(d.chat)}</div>
            <div class="row">
              <input id="pc" placeholder="Tanya apoteker..." />
              <button class="p" onclick="kirimP()">Kirim</button>
            </div>
          `;
        } catch (e) {
          $("#hasil").innerHTML = `<p class="m">${esc(e.message)}</p>`;
        }
      }

      async function kirimP() {
        const v = $("#pc").value.trim();
        if (!v) return;
        await api("/api/track/" + state.kodeAktif + "/chat", "POST", { pesan: v });
        lacak();
      }

      renderAuthPasien();
    </script>
  </body>
</html>
